[project]
name = "job-category-classifier"
version = "0.1.0"
description = "Classifies a job ad into one of six job-board categories (ML Zoomcamp midterm)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]
